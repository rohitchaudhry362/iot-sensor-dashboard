# HomePulse development broker.
# Anonymous access is acceptable only because the broker runs on a private development network;
# a production broker needs authentication, per-topic ACLs and TLS.
listener 1883
allow_anonymous true

# Keeps retained messages and queued messages for persistent sessions across broker restarts.
persistence true
persistence_location /mosquitto/data/

# The healthcheck connects every few seconds; without this, each connect and disconnect is logged.
connection_messages false

log_dest stdout
log_type error
log_type warning
log_type notice
