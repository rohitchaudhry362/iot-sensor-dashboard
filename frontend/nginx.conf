# Serves the built single-page app and proxies the API and the websocket to the backend, so the browser sees one
# origin. That is the same job the Vite dev-server proxy does in development.
#
# Two reasons, in order of importance. First, `npm run build` produces static files and nothing in the image
# serves them - the Vite dev server is a development tool and is not present here. Second, the app is written for
# a single origin: `api/client.ts` sends `credentials: 'same-origin'`, so on a cross-origin call the browser
# would withhold the refresh cookie, and `realtime/socket.ts` calls `io()` with no URL at all. Pointing the app
# at a separate API port would mean changing both and adding CORS with credentials to every request.

server {
    # 8080 rather than 80 because this runs as an unprivileged user, which cannot bind a port below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints these filenames, so a changed file is a different URL and the old one can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file that must never be cached: it is what points at the fingerprinted assets, so a
    # stale copy would keep sending browsers to a build that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:4000;
        # Socket.io opens with HTTP long-polling and then asks to upgrade. Without HTTP/1.1 and these two headers
        # nginx answers the poll but silently drops the upgrade, and the client stays on polling for ever.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A push-only socket can be quiet for a long time between sensor readings; the default 60s would close it
        # mid-session and force a reconnect every minute.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Every other path is a client-side route, so it has to return the app rather than a 404. This is last: the
    # more specific locations above win, so an unknown /api path still reaches the backend and gets its 401.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
